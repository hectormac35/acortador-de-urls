services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: acortador
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d acortador"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/acortador
      NEXTAUTH_URL: http://localhost:3001
      # Cámbialo por uno propio: openssl rand -base64 32
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-cambia-este-secreto-en-produccion}
    ports:
      - "3001:3000"

volumes:
  postgres_data:
